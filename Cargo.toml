[workspace]
resolver = "2"
members = [
    "crates/config",
    "crates/core",
    "crates/migrations",
    "crates/database",
    "crates/auth",
    "crates/api",
    "app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"