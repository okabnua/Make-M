[workspace]
resolver = "2"
members = [
    "crates/config",
    "crates/core",
    "crates/migrations",
    "crates/database",
    "crates/auth",
    "crates/api",
    "crates/assets",
    "crates/tasks",
    "crates/findings",
    "crates/exploration",
    "crates/llm",
    "crates/settings",
    "crates/guard",
    "crates/interception",
    "crates/egress",
    "crates/budget",
    "crates/traffic",
    "crates/evidence",
    "crates/reporting",
    "crates/enrichment",
    "crates/mcp",
    "crates/notifications",
    "crates/proxy",
    "app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"