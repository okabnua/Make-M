[package]
name = "engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Autonomous engine loop: planner/worker traits + intent scheduling (port of ARTEX server/engine.go)"

[dependencies]
exploration = { path = "../exploration" }
database = { path = "../database" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono"] }
thiserror = { workspace = true }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }